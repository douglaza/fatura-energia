services:
  db-test:
    image: postgres:16
    environment:
      POSTGRES_USER: cemig
      POSTGRES_PASSWORD: cemig
      POSTGRES_DB: cemigbill_test
    ports:
      - "5433:5432"   # 5433 para não conflitar com o dev (5432)
    tmpfs:
      - /var/lib/postgresql/data   # banco em RAM — rápido e descartável
