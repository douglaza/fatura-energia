services:
  db:
    image: postgres:16-alpine
    container_name: cemig-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cemig123}
      POSTGRES_USER: ${POSTGRES_USER:-cemig}
      POSTGRES_DB: ${POSTGRES_DB:-cemigbill}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cemig -d cemig_bill"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
